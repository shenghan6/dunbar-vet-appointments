{% extends "base.html" %}
{% block content %}
<h2>Edit Client</h2>
<form method="post">
    Name: <input name="name" value="{{ client.name }}"><br><br>
    Phone: <input name="phone" value="{{ client.phone }}"><br><br>
    Address: <input name="address" value="{{ client.address }}"><br><br>
    <button type="submit">Save</button>
    <a href="/clients">Cancel</a>
</form>
{% endblock %}
